version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      npm:
        patterns:
          - "*"
    ignore:
      # The SDK supports Node 20, so its types stay on Node 20.
      - dependency-name: "@types/node"
        versions: [">= 21"]
      # TypeScript 7 needs a tsconfig change and is checked on its own.
      - dependency-name: typescript
        versions: [">= 7"]
