name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the engines floor in package.json and 24 is what publish.yml runs on.
        # v0.3.0's publish broke on a Node 24 test-runner change that no PR ever ran into.
        node-version: ["20", "24"]
    name: npm test (node ${{ matrix.node-version }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm test
