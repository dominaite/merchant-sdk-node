name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the engines floor in package.json and 24 is what publish.yml runs on.
        # v0.3.0's publish broke on a Node 24 test-runner change that no PR ever ran into.
        node-version: ["20", "24"]
    name: npm test (node ${{ matrix.node-version }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm test
