name: Publish to npm

# Publishing is keyless: npm trusts this repo + this workflow file through a Trusted
# Publisher on the package and swaps GitHub's OIDC token for a short-lived publish
# credential at run time, so there is no NPM_TOKEN secret to store, rotate or leak.
# Provenance is attached automatically (public repo, public package).
#
# One-time setup on npmjs.com: @dominaite/merchant-sdk -> Settings -> Trusted Publisher
# -> GitHub Actions, then enter exactly (all fields are case-sensitive):
#   Organization or user: dominaite
#   Repository:           merchant-sdk-node
#   Workflow filename:    publish.yml
#   Environment name:     npm
#
#   Allowed actions:      untick `npm publish` (stage-only), so this workflow can only stage
#
# npm also checks that package.json's repository.url points at this repo.
# Trusted publishing needs npm >= 11.5.1 and Node >= 22.14.0; `npm stage` needs npm >= 11.15.0,
# hence Node 24 and the npm upgrade below.
#
# Staged publishing: this workflow uploads the release to npm's stage queue. It is NOT
# installable until a maintainer approves it with a 2FA / passkey check, which a CI token
# cannot do:
#   npm stage list @dominaite/merchant-sdk
#   npm stage approve <stage-id>        (or approve it on npmjs.com)
# A stolen CI token or a compromised workflow can stage a version but never release one.
#
# Tag push = staged release. The tag (minus the v) must equal package.json's version.
# workflow_dispatch stages the current package.json version from the chosen ref,
# for a tag whose publish run failed (v0.3.0 hit a Node 24 test-runner change).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write # required: GitHub mints the OIDC token npm exchanges for a publish credential
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm to a version with trusted publishing and npm stage
        run: |
          npm install -g npm@^11.15.0
          npm --version

      - name: Refuse a tag that disagrees with the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          package_version=$(node -p "require('./package.json').version")
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$package_version" != "$tag_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $package_version - bump package.json or retag."
            exit 1
          fi

      - run: npm ci

      - name: Run the test suite first
        run: npm test

      # prepare rebuilds dist before the tarball is packed.
      - name: Stage the release (trusted publishing, no tokens)
        run: npm stage publish --access public --provenance

      - name: Tell the maintainer what to approve
        run: |
          version=$(node -p "require('./package.json').version")
          {
            echo "### @dominaite/merchant-sdk $version is staged, not live"
            echo
            echo "Approve it with your passkey / 2FA:"
            echo
            echo '```'
            echo "npm stage list @dominaite/merchant-sdk"
            echo "npm stage approve <stage-id>"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
